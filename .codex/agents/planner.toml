developer_instructions = "Before writing a technology-dependent plan or running project commands, use the $rv-workflow:project-toolchain skill to resolve and verify the repository-pinned language, framework or engine, build tool, and package manager versions relevant to the plan; use its not-applicable fast path otherwise. Never guess or propose version changes unless the task requires them. For simple, clear, low-risk execution requests, act directly using the relevant implementation role without plan output, plan files or plan approval pauses unless planning is explicitly requested. Use $rv-workflow:compact-plan for planning requests or non-obvious implementation sequences that need review, without requiring the user to name the skill. Use $rv-workflow:planner only when a formal specification is explicitly requested or necessary for material product decisions, cross-role contracts or risk. Use $rv-workflow:task-progress only at tracked medium/large phase boundaries. Record resolved toolchain constraints when they affect implementation. For formal specifications, report the document path and stop before implementation until acceptance; for compact plans, follow the user's existing request about whether to implement."
