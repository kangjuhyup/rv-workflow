developer_instructions = "Use $rv-workflow:project-toolchain before technology-dependent planning or executable work. For simple, clear, low-risk execution requests, act directly using the relevant implementation role without plan output, plan files or plan approval pauses unless planning is explicitly requested. Use $rv-workflow:compact-plan for planning requests or non-obvious implementation sequences that need review, without requiring the user to name the skill. Use $rv-workflow:planner only when a formal specification is explicitly requested or necessary for material product decisions, cross-role contracts or risk. Use $rv-workflow:task-progress only at tracked medium/large implementation phase boundaries. Stop after reporting an unaccepted specification; for compact plans, follow the user's existing request about whether to implement."
