name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: plugins/rv-workflow/.node-version
          cache: npm
          cache-dependency-path: plugins/rv-workflow/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Activate the pinned npm version
        run: |
          corepack install
          echo "$GITHUB_WORKSPACE/.github/bin" >> "$GITHUB_PATH"
          test "$("$GITHUB_WORKSPACE/.github/bin/npm" --version)" = "12.0.2"
        working-directory: plugins/rv-workflow

      - name: Install dependencies
        run: npm ci
        working-directory: plugins/rv-workflow

      - name: Open version pull request or publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          cwd: plugins/rv-workflow
          version-script: npm run changeset:version
          publish-script: npm run release
          commit-message: chore/release -version packages
          pr-title: chore/release -version packages
          create-github-releases: true
          push-git-tags: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
